<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A letter for you</title>
<meta name="description" content="An apology and a birthday surprise.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1630;--paper:#f3effb;--flame:#ffb347;--rose:#e4577a;--mist:#b9aedb;
--serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:1.0625rem;line-height:1.65;overflow-x:hidden;transition:background .9s,color .9s}
body.day{background:var(--paper);color:var(--ink)}
main{min-height:100vh;display:grid;place-items:center;padding:clamp(1.25rem,5vw,3rem)}
.stage{display:none;width:min(36rem,100%)}
.stage.on{display:block}
h1,h2{font-family:var(--serif);font-weight:500;line-height:1.15;letter-spacing:-.01em;margin-bottom:1.5rem}
h1,h2{font-size:clamp(2rem,7.5vw,3.2rem)}
h1:focus,h2:focus{outline:none}
p{margin-bottom:1.1rem}
.fade{animation:in .8s ease both}
.hide{display:none}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sign{font-family:var(--serif);font-style:italic;font-size:1.35rem}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:999px;padding:.85rem 1.6rem;background:var(--flame);color:var(--ink);transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-2px)}
button:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
body.day button:focus-visible{outline-color:var(--ink)}
body.day .cta{background:var(--rose);color:#fff}
.row{margin-top:1.5rem}
.hint{font-size:.9rem;color:var(--mist)}
body.day .hint{color:#6b5f94}
/* promises */
.promises{display:grid;gap:.8rem;margin:1rem 0}
.promise{display:block;width:100%;text-align:left;border-radius:1rem;background:rgba(243,239,251,.08);color:var(--paper);border:2px solid var(--mist);padding:1rem 1.2rem}
.promise:hover{box-shadow:none}
.promise .t{font-family:var(--serif);font-size:1.25rem}
.promise .d{display:none;margin-top:.5rem;font-weight:400}
.promise[aria-expanded=true]{border-color:var(--flame);background:rgba(255,179,71,.12)}
.promise[aria-expanded=true] .d{display:block;animation:in .5s both}
/* candle */
.candle-wrap{display:grid;justify-items:center;gap:1rem;text-align:center}
svg.candle{width:min(13rem,55vw);height:auto;overflow:visible}
.flame{transform-origin:50% 100%;transition:opacity .5s,transform .5s}
.flame.off{opacity:0;transform:scale(.2)}
.flame.lit{animation:flick 1.4s ease-in-out infinite alternate}
@keyframes flick{from{transform:rotate(-2deg)}to{transform:scale(.94,1.08) rotate(2deg)}}
.glow{opacity:0;transition:opacity .6s}.glow.on{opacity:.55}
.smoke{opacity:0}.smoke.on{animation:rise 2.4s ease-out forwards}
@keyframes rise{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
/* balloons */
.balloons{display:flex;flex-wrap:wrap;justify-content:center;gap:1.2rem;margin:2rem 0 1rem}
.balloon{position:relative;width:4.6rem;height:5.8rem;padding:0;background:var(--c);border-radius:50% 50% 48% 48%;box-shadow:inset -8px -10px 0 rgba(0,0,0,.08);animation:bob 3s ease-in-out infinite alternate}
.balloon:nth-child(2){animation-delay:-.7s}.balloon:nth-child(3){animation-delay:-1.4s}.balloon:nth-child(4){animation-delay:-2.1s}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:2.2rem;background:currentColor;opacity:.35}
@keyframes bob{from{translate:0 0}to{translate:0 -12px}}
.balloon.pop{animation:pop .25s ease forwards;pointer-events:none}
@keyframes pop{to{transform:scale(1.5);opacity:0}}
.wishes{list-style:none;padding:0;display:grid;gap:1rem;margin:1rem 0 1.5rem}
.wishes li{padding-left:1.1rem;border-left:3px solid var(--rose);animation:in .6s both}
.count{font-family:var(--serif);font-size:1.4rem;margin:1.5rem 0}
.ghost{background:transparent;color:inherit;border:2px solid currentColor}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>

<section class="stage on" id="s0">
  <h1 id="h0" tabindex="-1">I owe you an apology.</h1>
  <div id="apology"></div>
  <div class="row"><button id="next" type="button">Next</button></div>
</section>

<section class="stage" id="s1">
  <h2 tabindex="-1">What I promise you</h2>
  <p>Tap each one to open it.</p>
  <div class="promises" id="promises"></div>
  <div class="row"><button id="go2" type="button" hidden>Continue</button></div>
</section>

<section class="stage" id="s2">
  <div class="candle-wrap">
    <svg class="candle" viewBox="0 0 120 200" role="img" aria-label="A birthday candle">
      <circle class="glow" id="glow" cx="60" cy="52" r="48" fill="#ffb347"/>
      <rect x="46" y="80" width="28" height="100" rx="6" fill="#e4577a"/>
      <path d="M46 104 L74 92 M46 128 L74 116 M46 152 L74 140" stroke="#fff" stroke-opacity=".55" stroke-width="6"/>
      <rect x="20" y="178" width="80" height="12" rx="6" fill="#b9aedb"/>
      <line x1="60" y1="80" x2="60" y2="68" stroke="#f3effb" stroke-width="3" stroke-linecap="round"/>
      <g class="flame off" id="flame">
        <path d="M60 22 C74 40 76 58 60 68 C44 58 46 40 60 22Z" fill="#ffb347"/>
        <path d="M60 40 C67 50 67 60 60 66 C53 60 53 50 60 40Z" fill="#fff3c4"/>
      </g>
      <path class="smoke" id="smoke" d="M60 66 C52 52 68 44 58 30" stroke="#b9aedb" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
    <h2 id="ctext" tabindex="-1" style="font-size:1.8rem;margin:0">Before the cake, one small thing.</h2>
    <button id="light" type="button">Light the candle</button>
    <button id="blow" type="button" hidden>Make a wish and blow it out</button>
  </div>
</section>

<section class="stage" id="s3">
  <h2 id="h3" tabindex="-1">Happy birthday!</h2>
  <p id="bintro"></p>
  <div class="balloons" id="balloons"></div>
  <p class="hint" id="bhint">Pop the balloons to read your wishes.</p>
  <ul class="wishes" id="wishes"></ul>
  <div id="finale" class="hide">
    <p class="count" id="count"></p>
    <p class="sign" id="sign"></p>
    <div class="row"><button class="ghost" id="again" type="button">Read it again</button></div>
  </div>
</section>

</main>
<canvas id="cv" aria-hidden="true"></canvas>

<script>
/* ===== EDIT THIS: your words ===== */
const CONFIG = {
  apology: [
    "I have hurt you many times with my words and with the way I behaved. I'm not going to soften that or explain it away.",
    "You deserved patience and kindness from me, and too often I gave you the opposite. I'm sorry for every time I made you feel small, unheard or hurt.",
    "I can't undo what I said or did. What I can do is own it, and change how I speak to you and how I treat you."
  ],
  promises: [
    {t: "I will think before I speak", d: "When I'm angry or stressed, I'll pause first. My words should never be something you have to recover from."},
    {t: "I will really listen", d: "When you tell me how you feel, I'll hear it fully instead of defending myself."},
    {t: "I will treat you with respect", d: "Even when we disagree. Especially when we disagree."}
  ],
  birthdayIntro: "5 December is your day, and you deserve to feel cared for on it.",
  wishes: [
    "May this year be gentle with you.",
    "May the people around you treat you the way you deserve.",
    "May you be heard, respected and appreciated every single day.",
    "May everything you've been quietly working towards finally come together."
  ],
  birthday: {month: 12, day: 5},
  sign: "Happy birthday. I hope today is a good one."
};
/* ================================================= */

const $ = id => document.getElementById(id);
const stages = ["s0","s1","s2","s3"].map($);
function show(i){
  stages.forEach((s,n)=>s.classList.toggle("on",n===i));
  document.body.classList.toggle("day",i===3);
  const h=stages[i].querySelector("h1,h2"); if(h) h.focus({preventScroll:true});
  scrollTo(0,0);
}
const el=(tag,txt,cls)=>{const e=document.createElement(tag);if(txt)e.textContent=txt;if(cls)e.className=cls;return e};

/* 1. Apology, one line at a time */
const lines=CONFIG.apology.map((t,i)=>{const p=el("p",t,i?"hide":"");$("apology").appendChild(p);return p});
let shown=1;
$("next").onclick=()=>{
  if(shown<lines.length){lines[shown].classList.remove("hide");lines[shown].classList.add("fade");shown++;
    if(shown===lines.length)$("next").textContent="Continue";}
  else show(1);
};
if(lines.length===1)$("next").textContent="Continue";

/* 2. Promises */
let opened=0;
CONFIG.promises.forEach(pr=>{
  const b=el("button","","promise");b.type="button";b.setAttribute("aria-expanded","false");
  b.append(el("span",pr.t,"t"),el("span",pr.d,"d"));
  b.onclick=()=>{ if(b.getAttribute("aria-expanded")==="true")return;
    b.setAttribute("aria-expanded","true");opened++;
    if(opened===CONFIG.promises.length){$("go2").hidden=false;$("go2").focus();}};
  $("promises").appendChild(b);
});
$("go2").onclick=()=>show(2);

/* 3. Candle */
$("light").onclick=()=>{
  $("flame").classList.replace("off","lit");$("glow").classList.add("on");
  $("light").hidden=true;$("blow").hidden=false;$("ctext").textContent="Now make a wish.";$("blow").focus();
};
$("blow").onclick=()=>{
  $("flame").classList.replace("lit","off");$("glow").classList.remove("on");$("smoke").classList.add("on");
  $("blow").hidden=true;
  setTimeout(()=>{show(3);burst(innerWidth/2,innerHeight*.3,140);},1100);
};

/* 4. Balloons */
$("bintro").textContent=CONFIG.birthdayIntro;
const colors=["#e4577a","#ffb347","#7a6bd1","#3fb8a5","#ef7d57","#5b9bd5"];
let popped=0;
CONFIG.wishes.forEach((w,i)=>{
  const b=el("button","","balloon");b.type="button";
  b.style.setProperty("--c",colors[i%colors.length]);b.setAttribute("aria-label","Balloon "+(i+1)+", pop to read a wish");
  b.onclick=e=>{
    const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,40);
    b.classList.add("pop");setTimeout(()=>b.remove(),250);
    $("wishes").appendChild(el("li",w));popped++;
    if(popped===CONFIG.wishes.length){
      $("bhint").hidden=true;$("finale").classList.remove("hide");$("finale").classList.add("fade");
      $("sign").textContent=CONFIG.sign;setTimeout(()=>burst(innerWidth/2,innerHeight*.4,120),300);
    }
  };
  $("balloons").appendChild(b);
});
/* countdown */
(function(){
  const n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  let d=new Date(n.getFullYear(),CONFIG.birthday.month-1,CONFIG.birthday.day);
  if(d<t0)d=new Date(n.getFullYear()+1,CONFIG.birthday.month-1,CONFIG.birthday.day);
  const days=Math.round((d-t0)/864e5);
  $("count").textContent=days===0?"Your birthday is today.":days===1?"Your birthday is tomorrow.":days+" days until your birthday.";
})();
$("again").onclick=()=>location.reload();

/* Confetti */
const cv=$("cv"),cx=cv.getContext("2d");let parts=[],raf;
function size(){cv.width=innerWidth;cv.height=innerHeight}addEventListener("resize",size);size();
function burst(x,y,n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=["#e4577a","#ffb347","#b9aedb","#3fb8a5","#7a6bd1","#fff"];
  for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*14,vy:Math.random()*-11-2,w:6+Math.random()*6,h:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:c[i%c.length]});
  cancelAnimationFrame(raf);tick();
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
  parts=parts.filter(p=>p.y<cv.height+20);
  if(parts.length)raf=requestAnimationFrame(tick);else cx.clearRect(0,0,cv.width,cv.height);
}
</script>
</body>
</html>
